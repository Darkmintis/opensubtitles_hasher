name: opensubtitles_hasher
description: >-
  Fast OpenSubtitles hashing (128 KB only). Includes a built-in movie picker
  for all platforms - Android folder browser, iOS, macOS, Windows, and Linux.
version: 1.1.1
homepage: https://github.com/Darkmintis/opensubtitles_hasher
repository: https://github.com/Darkmintis/opensubtitles_hasher
issue_tracker: https://github.com/Darkmintis/opensubtitles_hasher/issues

topics:
  - opensubtitles
  - hash
  - subtitle
  - video
  - media

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.opensubtitles.hasher
        pluginClass: OpenSubtitlesHasherPlugin
     # ios:
     #   pluginClass: OpenSubtitlesHasherPlugin
     # linux:
     #   dartPluginClass: OpenSubtitlesHasherLinux
     # macos:
     #   dartPluginClass: OpenSubtitlesHasherMacOS
     # windows:
     #   dartPluginClass: OpenSubtitlesHasherWindows